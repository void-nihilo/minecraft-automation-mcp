plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'minecraft.automation.mcp'
version = '0.1.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://modmaven.dev/'
        content { includeGroup 'appeng' }
    }
    maven {
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
}

dependencies {
    compileOnly fg.deobf('maven.modrinth:7tG215v7:CC9c0z7p') { transitive = false }
    compileOnly fg.deobf('maven.modrinth:B1CBVXHX:FX8CaaJ8') { transitive = false }
    compileOnly fg.deobf('appeng:appliedenergistics2-forge:15.4.10') { transitive = false }
    compileOnly fg.deobf('dev.ftb.mods:ftb-quests-forge:2001.4.22') { transitive = false }
    compileOnly fg.deobf('dev.ftb.mods:ftb-teams-forge:2001.3.2') { transitive = false }
    compileOnly fg.deobf('dev.ftb.mods:ftb-library-forge:2001.2.13') { transitive = false }
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.16'
}

tasks.named('jar').configure {
    manifest.attributes('MixinConfigs': 'minecraft_automation_mcp.mixins.json')
    finalizedBy 'reobfJar'
}
